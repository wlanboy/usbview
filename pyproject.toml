[project]
name = "usbview"
version = "0.1.0"
description = "USB HDMI Capture Card viewer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.48",
    "opencv-python-headless>=5.0.0.93",
    "starlette>=1.10.0",
    "numpy>=2.5.4",
    "mss>=10.2.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pyright]
# Runs under the OS python3 (PyGObject/GStreamer), not this project's uv venv.
exclude = ["wayland_capture_helper.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
