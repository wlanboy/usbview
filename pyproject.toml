[project]
name = "usbview"
version = "0.1.0"
description = "USB HDMI Capture Card viewer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.48",
    "opencv-python-headless>=4.13",
    "starlette>=1.1.0",
    "numpy>=2.4.6",
    "mss>=9.0.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.1.1",
    "ruff>=0.15.14",
]

[tool.pyright]
# Runs under the OS python3 (PyGObject/GStreamer), not this project's uv venv.
exclude = ["wayland_capture_helper.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
